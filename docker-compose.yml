version: '3.8'

services:
  database:
    image: postgres
    container_name: surbana-database
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB_NAME}
    volumes:
      - postgres:/data/postgres
    ports:
      - ${DATABASE_PORT}:5432

volumes:
  postgres:
